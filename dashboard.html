/* Product Card Action Buttons */

.product .actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 12px;
}

.product .actions .btn {
    flex: 1;
    min-width: 90px;
    text-align: center;
    cursor: pointer;
}

.product .actions .btn.alt {
    background: #eef2ff;
    color: #4568e8;
    border: 1px solid #dce3f3;
}

.product .actions .btn.danger {
    background: #fff1f3;
    color: #bf4056;
    border: 1px solid #f1cbd2;
}

/* CUSTOM EDIT MODAL */

.modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(12, 22, 45, .58);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 15px;
    overflow-y: auto;
    backdrop-filter: blur(4px);
}

.modal-overlay.hidden {
    display: none !important;
}

.edit-modal {
    width: 100%;
    max-width: 440px;
    background: #fff;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 20px 65px rgba(0,0,0,.2);
    animation: modalShow .22s ease;
    margin: auto;
}

@keyframes modalShow {
    from {
        opacity: 0;
        transform: translateY(15px) scale(.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 17px;
}

.modal-header h2 {
    font-size: 19px;
    margin: 0;
    color: #172033;
}

.modal-header p {
    font-size: 11px;
    color: #6b768b;
    margin: 5px 0 0;
}

.close-modal {
    border: none;
    background: #f1f3f8;
    color: #526078;
    border-radius: 8px;
    width: 32px;
    height: 32px;
    font-size: 23px;
    cursor: pointer;
}

.modal-field {
    margin-bottom: 13px;
}

.modal-field label {
    display: block;
    font-size: 11px;
    font-weight: 750;
    color: #536078;
    margin-bottom: 6px;
}

.modal-field input,
.modal-field textarea {
    width: 100%;
    padding: 11px;
    border: 1px solid #dce3ed;
    border-radius: 8px;
    background: #fbfcfe;
    font: inherit;
    font-size: 12px;
    color: #172033;
    outline: none;
}

.modal-field textarea {
    resize: vertical;
}

.modal-field input:focus,
.modal-field textarea:focus {
    border-color: #8095ef;
    box-shadow: 0 0 0 3px #4568e814;
    background: #fff;
}

.modal-actions {
    display: flex;
    gap: 9px;
    margin-top: 18px;
}

.modal-actions button {
    flex: 1;
    cursor: pointer;
}

@media(max-width:480px) {
    .edit-modal {
        padding: 16px;
    }
}

function openEditModal(p) {

    $("editProductId").value = p.id;

    $("editPlan").value = p.plan || "";

function closeEditModal() {

}

$("closeModal").addEventListener("click", closeEditModal);

$("editModal").addEventListener("click", e => {

// SAVE PRODUCT CHANGES

$("editForm").addEventListener("submit", async e => {

    e.preventDefault();

    const id = $("editProductId").value;

    const name = $("editName").value.trim();
    const description = $("editDescription").value.trim();
    const plan = Number($("editPlan").value);
    const location = $("editLocation").value.trim();
    const radius = Number($("editRadius").value);

    if (!name || !description || !Number.isFinite(plan) || plan <= 0) {
        $("editStatus").textContent = "Please enter valid product details.";
        $("editStatus").className = "status error";
        return;
    }

    if (!Number.isFinite(radius) || radius < 0) {
        $("editStatus").textContent = "Enter a valid promotion radius.";
        $("editStatus").className = "status error";
        return;
    }

    const saveBtn = $("saveEdit");

    saveBtn.disabled = true;
    saveBtn.textContent = "Saving...";

    try {

        const updatedData = {
            productName: name,
            description: description,
            plan: plan,
            location: location,
            radius: radius
        };

        await updateDoc(
            doc(db, "products", id),
            updatedData
        );

        const next = loadedProducts.map(p =>
            p.id === id ? { ...p, ...updatedData } : p
        );

        render(next);

        $("resultInfo").textContent =
            `Found ${next.length} product(s).`;

        closeEditModal();

        setStatus("Product updated successfully!");

    } catch (error) {

        console.error(error);

        $("editStatus").textContent =
            "Update failed: " + error.message;

        $("editStatus").className = "status error";

    } finally {

        saveBtn.disabled = false;
        saveBtn.textContent = "Save Changes";
    }
});

function render(items) {
    loadedProducts = items;

    const list = $("productList");
    list.innerHTML = "";

    if (!items.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No products found.";
        list.append(empty);
        return;
    }

    items.forEach(p => {

        const card = document.createElement("article");
        card.className = "product";

        // Product Image
        const img = document.createElement("img");
        img.src = p.productPhoto || "";
        img.alt = p.productName || "Product";

        if (!p.productPhoto) {
            img.classList.add("hidden");
        }

        card.append(img);

        // Product Name
        const h = document.createElement("h3");
        h.textContent = p.productName || "Untitled product";
        card.append(h);

        // Description
        const desc = document.createElement("p");
        desc.textContent = p.description || "";
        card.append(desc);

        // Product Details
        const meta = document.createElement("p");

        [
            `Plan ₹${Number(p.plan || 0)}`,
            `Payment: ${p.paymentStatus || "Pending"}`,
            `Promotion: ${p.approvalStatus || "Pending"}`
        ].forEach(label => {
            const pill = document.createElement("span");
            pill.className = "pill";
            pill.textContent = label;
            meta.append(pill);
        });

        card.append(meta);

        // Location
        const loc = document.createElement("p");
        loc.className = "muted";
        loc.textContent =
            (p.location || "") +
            (p.radius ? ` · ${p.radius} km radius` : "");

        card.append(loc);

// REAL UPI PAYMENT QR CODE

qrSection.style.cssText = `

const qrTitle = document.createElement("p");

const amount = Number(p.plan || 0);

if (amount > 0 && window.QRCode) {

    const upiLink = new URLSearchParams({

        // Action Buttons

actions.append(edit);
